<!doctype html>
<html lang="en" class="h-full overscroll-none">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/png" href="/studio-favicon.png" />
		<title>Studio</title>
		<script>
			// apply the saved theme before first paint
			try {
				var theme = localStorage.getItem("theme") || "light"
				if (theme === "system")
					theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
				document.documentElement.setAttribute("data-theme", theme)
				var layer = location.pathname.split("/")[2]
				document.documentElement.setAttribute("data-layer", ["web", "analytics", "ui"].includes(layer) ? layer : "ai")
			} catch (e) {}
		</script>
	</head>
	<body class="h-full overscroll-none bg-surface-base">
		<div id="app" class="h-full"></div>
		<div id="modals"></div>
		<div id="popovers"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
